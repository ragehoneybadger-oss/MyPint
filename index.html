<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cropper with 1:1 Square Pad Default</title>

  <!-- Cropper.js CSS -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.5.13/cropper.min.css" />

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      padding: 20px;
      background-color: #f4f4f9;
      color: #333;
    }

    .container {
      max-width: 800px;
      margin: 0 auto;
      background: #fff;
      padding: 20px;
      border-radius: 8px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
    }

    .controls {
      display: flex;
      gap: 15px;
      align-items: center;
      margin-bottom: 20px;
      flex-wrap: wrap;
    }

    .controls label {
      font-weight: bold;
    }

    .controls select, .controls input[type="file"], .controls button {
      padding: 8px 12px;
      font-size: 14px;
      border: 1px solid #ccc;
      border-radius: 4px;
    }

    .controls button {
      background-color: #007bff;
      color: #fff;
      border: none;
      cursor: pointer;
      transition: background-color 0.2s ease;
    }

    .controls button:hover {
      background-color: #0056b3;
    }

    .controls button#reset-btn {
      background-color: #6c757d;
    }

    .controls button#reset-btn:hover {
      background-color: #5a6268;
    }

    .img-container {
      width: 100%;
      max-height: 500px;
      background-color: #e9ecef;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
      margin-bottom: 20px;
      border-radius: 4px;
    }

    .img-container img {
      max-width: 100%;
      display: block;
    }

    .preview-container {
      text-align: center;
    }

    .preview-container canvas {
      max-width: 100%;
      height: auto;
      border: 1px solid #ddd;
      border-radius: 4px;
    }
  </style>
</head>
<body>

  <div class="container">
    <form id="image-form">
      <div class="controls">
        <input type="file" id="upload-image" accept="image/*" />

        <label for="aspect-ratio">Aspect Ratio:</label>
        <select id="aspect-ratio">
          <option value="1" selected>1:1 (Square Pad)</option>
          <option value="1.77777777778">16:9</option>
          <option value="1.33333333333">4:3</option>
          <option value="0">Freeform</option>
        </select>

        <button type="button" id="crop-btn">Crop & Process</button>
        <button type="reset" id="reset-btn">Reset</button>
      </div>
    </form>

    <div class="img-container">
      <img id="cropper-image" src="" alt="Source Image" style="display: none;" />
    </div>

    <div class="preview-container">
      <h3>Result Preview</h3>
      <canvas id="output-canvas"></canvas>
    </div>
  </div>

  <!-- Cropper.js JavaScript -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.5.13/cropper.min.js"></script>

  <script>
    document.addEventListener('DOMContentLoaded', () => {
      let cropper = null;

      const DEFAULT_ASPECT_RATIO = 1; // 1:1 Square ratio default

      const form = document.getElementById('image-form');
      const uploadInput = document.getElementById('upload-image');
      const image = document.getElementById('cropper-image');
      const aspectRatioSelect = document.getElementById('aspect-ratio');
      const cropBtn = document.getElementById('crop-btn');
      const resetBtn = document.getElementById('reset-btn');
      const outputCanvas = document.getElementById('output-canvas');
      const ctx = outputCanvas.getContext('2d');

      // 1. Handle File Upload
      uploadInput.addEventListener('change', (e) => {
        const files = e.target.files;
        if (files && files.length > 0) {
          const reader = new FileReader();
          reader.onload = (event) => {
            image.src = event.target.result;
            image.style.display = 'block';

            if (cropper) {
              cropper.destroy();
            }

            // Initialize Cropper with Default Ratio (1:1)
            cropper = new Cropper(image, {
              aspectRatio: DEFAULT_ASPECT_RATIO,
              viewMode: 1,
              autoCropArea: 1,
              responsive: true,
            });
          };
          reader.readAsDataURL(files[0]);
        }
      });

      // 2. Handle Aspect Ratio Dropdown Change
      aspectRatioSelect.addEventListener('change', (e) => {
        if (!cropper) return;
        const val = parseFloat(e.target.value);
        cropper.setAspectRatio(val > 0 ? val : NaN); // NaN sets Freeform
      });

      // 3. Handle Form Reset Action
      form.addEventListener('reset', () => {
        // Delay slightly to let standard form reset clear input fields
        setTimeout(() => {
          // Explicitly restore select element to default value "1"
          aspectRatioSelect.value = DEFAULT_ASPECT_RATIO.toString();

          if (cropper) {
            cropper.reset(); // Resets crop box zoom/position
            cropper.setAspectRatio(DEFAULT_ASPECT_RATIO); // Enforces 1:1 ratio
          }

          // Clear output canvas
          ctx.clearRect(0, 0, outputCanvas.width, outputCanvas.height);
          outputCanvas.width = 0;
          outputCanvas.height = 0;
        }, 0);
      });

      // 4. Handle Crop Button Click
      cropBtn.addEventListener('click', () => {
        if (!cropper) return;

        const croppedCanvas = cropper.getCroppedCanvas();
        if (!croppedCanvas) return;

        const currentRatio = aspectRatioSelect.value;

        // If 1:1 (Square Pad) is selected, perform padding processing
        if (currentRatio === "1") {
          const side = Math.max(croppedCanvas.width, croppedCanvas.height);

          outputCanvas.width = side;
          outputCanvas.height = side;

          // Fill canvas background (White pad by default)
          ctx.fillStyle = '#ffffff';
          ctx.fillRect(0, 0, side, side);

          // Center cropped image onto square canvas
          const x = (side - croppedCanvas.width) / 2;
          const y = (side - croppedCanvas.height) / 2;
          ctx.drawImage(croppedCanvas, x, y);
        } else {
          // Standard direct output for non-pad ratios
          outputCanvas.width = croppedCanvas.width;
          outputCanvas.height = croppedCanvas.height;
          ctx.drawImage(croppedCanvas, 0, 0);
        }
      });
    });
  </script>
</body>
</html>
